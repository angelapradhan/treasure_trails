<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Treasure Trails - Adventure Awaits</title>
    <link rel="stylesheet" href="style.css">
</head>
<body class="landing-body">
    <nav class="nav-container">
        <div class="nav-left">
            <span class="mini-logo">TREASURE <br> TRAILS</span>
        </div>
        <ul class="nav-menu">
            <li class="active">Welcome</li>
            <li>News</li>
            <li>Explore</li>
            <li>Gear</li>
            <li>Community</li>
        </ul>
        <div class="nav-right">
            <a href="login.html" class="btn-nav">Login</a>
            <a href="register.html" class="btn-nav">Register</a>
        </div>
    </nav>

    <section class="hero-container">
        <div class="hero-content">
            <h1 class="main-title">TREASURE<br>TRAILS</h1>
            <p class="main-subtitle">ADVENTURE AWAITS</p>
        </div>
    </section>

    <div class="bottom-action">
        <button class="btn-gold-small">Redeem Codes</button>
    </div>

    <audio id="bgAudio" src="images/aaa.mp3" preload="auto" loop></audio>

    <script>
        const audio = document.getElementById("bgAudio");

        // Save timestamp and state before user navigates away
        window.addEventListener("beforeunload", () => {
            localStorage.setItem("audioTime", audio.currentTime);
            localStorage.setItem("audioPlaying", !audio.paused);
        });

        document.addEventListener("DOMContentLoaded", () => {
            const savedTime = localStorage.getItem("audioTime");
            const wasPlaying = localStorage.getItem("audioPlaying");

            if (savedTime) {
                audio.currentTime = parseFloat(savedTime);
            }

            const playAudio = () => {
                audio.play()
                    .then(() => {
                        // Remove listeners once it successfully starts playing
                        document.removeEventListener("click", playAudio);
                        document.removeEventListener("keydown", playAudio);
                    })
                    .catch(err => console.log("Autoplay blocked. Waiting for user interaction."));
            };
4
            if (wasPlaying === "true") {
                audio.play().catch(() => {
                    document.addEventListener("click", playAudio);
                    document.addEventListener("keydown", playAudio);
                });
            } else {
                // Instantly plays on the very first click anywhere on the landing page
                document.addEventListener("click", playAudio);
                document.addEventListener("keydown", playAudio);
            }
        });
    </script>
</body>
</html>
